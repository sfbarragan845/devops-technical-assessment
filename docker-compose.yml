version: '3.8'

services:
  devops-microservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-microservice
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - API_KEY=your-api-key
      - JWT_SECRET=your-secret-key
      - API_KEY_TEST=your-api-key
      - JWT_SECRET_TEST=your-secret-key
      - JWT_EXPIRATION_HOURS=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Load balancer simulado con nginx
  nginx-lb:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - devops-microservice
    restart: unless-stopped

# Opcional: Agregar múltiples instancias del microservicio
  devops-microservice-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-microservice-2
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - API_KEY=your-api-key
      - JWT_SECRET=your-secret-key
      - API_KEY_TEST=your-api-key
      - JWT_SECRET_TEST=your-secret-key
      - JWT_EXPIRATION_HOURS=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped