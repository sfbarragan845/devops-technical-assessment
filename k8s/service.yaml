# Create a load balancer service to expose the microservice
apiVersion: v1
kind: Service
metadata:
  name: devops-microservice
  namespace: production
  labels:
    app: devops-microservice
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
spec:
  type: LoadBalancer
  selector:
    app: devops-microservice
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
      name: http
  sessionAffinity: None
