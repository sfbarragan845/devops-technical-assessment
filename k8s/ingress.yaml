apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-microservice-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    acme.cert-manager.io/http01-edit-in-place: "true"
    # Desactivar SSL redirect temporalmente para permitir HTTP-01
    appgw.ingress.kubernetes.io/ssl-redirect: "false"
    # Configurar health probes para Application Gateway
    appgw.ingress.kubernetes.io/health-probe-status-codes: "200-499"
spec:
  tls:
    - hosts:
        - devops-api.172.190.229.231.nip.io
      secretName: devops-tls-secret
  rules:
    - host: devops-api.172.190.229.231.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-microservice
                port:
                  number: 80
