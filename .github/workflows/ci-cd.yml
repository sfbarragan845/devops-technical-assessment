name: CI/CD Pipeline
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - development
          - production
      version:
        description: "Docker image tag to deploy"
        required: true
        default: "latest"

env:
  REGISTRY: ${{ secrets.AZURE_REGISTRY_NAME }}
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  # Stage 1: Lint - Static Code Analysis
  lint:
    name: Lint and Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pylint
        run: |
          source venv/bin/activate
          pylint app/ --exit-zero --output-format=text --reports=yes | tee pylint-report.txt

      - name: Run Flake8
        run: |
          source venv/bin/activate
          flake8 app/ --max-line-length=100 --statistics --count

      - name: Check code formatting with Black
        run: |
          source venv/bin/activate
          black --check app/

      - name: Run MyPy type checking
        run: |
          source venv/bin/activate
          mypy app/ --ignore-missing-imports || true

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: pylint-report.txt
  # Stage 2: Test - Unit and Integration Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    environment: test
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          JWT_SECRET_TEST: ${{ secrets.JWT_SECRET_TEST  }}
          API_KEY_TEST: ${{ secrets.API_KEY_TEST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_KEY: ${{ secrets.API_KEY }}
          PORT: ${{ vars.PORT }}
          DEBUG: true
        run: |
          source venv/bin/activate
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Check coverage threshold
        run: |
          source venv/bin/activate
          coverage report --fail-under=80 --omit="app/config.py"

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # Stage 3: Build and Push Docker Image to Azure Container Registry
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    environment: test
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # DEBUG: Verificar valores de las variables
      - name: Debug - Show registry info
        run: |
          echo "Registry Name: ${{ secrets.AZURE_REGISTRY_NAME }}"
          echo "Full Registry: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io"
          echo "Image will be: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/${{ github.event.repository.name }}"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      # DEBUG: Verificar que el login funcionó
      - name: Verify Docker login
        run: |
          cat ~/.docker/config.json
          docker info

      - name: Set image variables
        id: vars
        run: |
          # Asegurar que tenemos el registry completo
          REGISTRY="${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io"
          IMAGE_NAME="${{ github.event.repository.name }}"
          BRANCH="${{ github.ref_name }}"
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)

          # Construir las tags completas
          TAG_BRANCH="${REGISTRY}/${IMAGE_NAME}:${BRANCH}"
          TAG_SHA="${REGISTRY}/${IMAGE_NAME}:${SHA_SHORT}"
          TAG_LATEST="${REGISTRY}/${IMAGE_NAME}:latest"

          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT
          echo "image-name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "tag-branch=${TAG_BRANCH}" >> $GITHUB_OUTPUT
          echo "tag-sha=${TAG_SHA}" >> $GITHUB_OUTPUT
          echo "tag-latest=${TAG_LATEST}" >> $GITHUB_OUTPUT

          # Mostrar las tags que se van a usar
          echo "Tags to be used:"
          echo "  - ${TAG_BRANCH}"
          echo "  - ${TAG_SHA}"
          echo "  - ${TAG_LATEST}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.tag-branch }}
            ${{ steps.vars.outputs.tag-sha }}
            ${{ steps.vars.outputs.tag-latest }}
          provenance: false
          sbom: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.vars.outputs.tag-latest }}
          format: "sarif"
          output: "trivy-report.sarif"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-report.sarif"

  # Stage 4: Deploy to Development
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: https://dev-devops-api.172.190.229.231.nip.io
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image variables
        id: image-vars
        run: |
          REGISTRY="${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io"
          IMAGE_NAME="${{ github.event.repository.name }}"
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT
          echo "image-name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "Full image: ${REGISTRY}/${IMAGE_NAME}:develop"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configure kubectl with kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl config use-context $(kubectl config current-context)

      - name: Create namespace if not exists
        run: |
          export KUBECONFIG=kubeconfig
          kubectl create namespace development --dry-run=client -o yaml | kubectl apply -f -

      - name: Create ACR Secret
        run: |
          export KUBECONFIG=kubeconfig
          kubectl create secret docker-registry acr-secret \
            --namespace development \
            --docker-server=${{ steps.image-vars.outputs.registry }} \
            --docker-username=${{ secrets.AZURE_REGISTRY_USERNAME }} \
            --docker-password=${{ secrets.AZURE_REGISTRY_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install cert-manager (if not exists)
        run: |
          export KUBECONFIG=kubeconfig
          # Verificar si cert-manager ya está instalado
          if ! kubectl get namespace cert-manager >/dev/null 2>&1; then
            echo "Installing cert-manager..."
            kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.0/cert-manager.yaml
            echo "Waiting for cert-manager to be ready..."
            kubectl wait --for=condition=Available --timeout=300s deployment/cert-manager -n cert-manager
            kubectl wait --for=condition=Available --timeout=300s deployment/cert-manager-webhook -n cert-manager
            kubectl wait --for=condition=Available --timeout=300s deployment/cert-manager-cainjector -n cert-manager
          else
            echo "cert-manager is already installed"
          fi

      - name: Apply ClusterIssuer
        run: |
          export KUBECONFIG=kubeconfig
          export LETSENCRYPT_EMAIL="${{ secrets.LETSENCRYPT_EMAIL }}"

          envsubst < k8s/cluster-issuer-development.template.yaml | kubectl apply -f -
          sleep 10
          kubectl get clusterissuer letsencrypt-development -o yaml

      - name: Apply Kubernetes Secret
        run: |
          export KUBECONFIG=kubeconfig
          kubectl create secret generic devops-secrets \
            --from-literal=API_KEY="${{ secrets.API_KEY }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=API_KEY_TEST="${{ secrets.API_KEY }}" \
            --from-literal=JWT_SECRET_TEST="${{ secrets.JWT_SECRET }}" \
            --from-literal=JWT_EXPIRATION_HOURS="${{ vars.JWT_EXPIRATION_HOURS }}" \
            --from-literal=PORT="${{ vars.PORT }}" \
            --namespace=development \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          export KUBECONFIG=kubeconfig
          kubectl apply -f k8s/configmap.yaml -n development
          kubectl apply -f k8s/deployment.yaml -n development
          kubectl apply -f k8s/service.yaml -n development
          kubectl apply -f k8s/hpa.yaml -n development

      - name: Update image tag
        run: |
          export KUBECONFIG=kubeconfig
          kubectl set image deployment/devops-microservice \
            devops-microservice=${{ steps.image-vars.outputs.registry }}/${{ steps.image-vars.outputs.image-name }}:develop \
            -n development

      - name: Wait for rollout
        run: |
          export KUBECONFIG=kubeconfig
          kubectl rollout status deployment/devops-microservice -n development --timeout=5m

      - name: Verify deployment
        run: |
          export KUBECONFIG=kubeconfig
          kubectl get pods -n development -l app=devops-microservice
          kubectl get svc -n development devops-microservice

      - name: Verify TLS Certificate
        run: |
          export KUBECONFIG=kubeconfig
          echo "=== Certificate Status ==="
          kubectl get certificate -n development
          echo ""
          echo "=== Certificate Details ==="
          kubectl describe certificate devops-tls-secret -n development || echo "Certificate not created yet"
          echo ""
          echo "=== TLS Secret Status ==="
          kubectl get secret devops-tls-secret -n development || echo "TLS secret not created yet"

  # Stage 5: Deploy to Production
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://devops-api.172.190.229.231.nip.io
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image variables
        id: image-vars
        run: |
          REGISTRY="${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io"
          IMAGE_NAME="${{ github.event.repository.name }}"
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT
          echo "image-name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "Full image: ${REGISTRY}/${IMAGE_NAME}:latest"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configure kubectl with kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl config use-context $(kubectl config current-context)

      - name: Create namespace if not exists
        run: |
          export KUBECONFIG=kubeconfig
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

      - name: Create ACR Secret
        run: |
          export KUBECONFIG=kubeconfig
          kubectl create secret docker-registry acr-secret \
            --namespace production \
            --docker-server=${{ steps.image-vars.outputs.registry }} \
            --docker-username=${{ secrets.AZURE_REGISTRY_USERNAME }} \
            --docker-password=${{ secrets.AZURE_REGISTRY_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install cert-manager (if not exists)
        run: |
          export KUBECONFIG=kubeconfig
          # Verificar si cert-manager ya está instalado
          if ! kubectl get namespace cert-manager >/dev/null 2>&1; then
            echo "Installing cert-manager..."
            kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.0/cert-manager.yaml
            echo "Waiting for cert-manager to be ready..."
            kubectl wait --for=condition=Available --timeout=300s deployment/cert-manager -n cert-manager
            kubectl wait --for=condition=Available --timeout=300s deployment/cert-manager-webhook -n cert-manager
            kubectl wait --for=condition=Available --timeout=300s deployment/cert-manager-cainjector -n cert-manager
          else
            echo "cert-manager is already installed"
          fi

      - name: Apply ClusterIssuer
        run: |
          export KUBECONFIG=kubeconfig
          export LETSENCRYPT_EMAIL="${{ secrets.LETSENCRYPT_EMAIL }}"

          envsubst < k8s/cluster-issuer.template.yaml | kubectl apply -f -
          sleep 10
          kubectl get clusterissuer letsencrypt-prod -o yaml

      - name: Apply Kubernetes Secret
        run: |
          export KUBECONFIG=kubeconfig
          kubectl create secret generic devops-secrets \
            --from-literal=API_KEY="${{ secrets.API_KEY }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=API_KEY_TEST="${{ secrets.API_KEY }}" \
            --from-literal=JWT_SECRET_TEST="${{ secrets.JWT_SECRET }}" \
            --from-literal=JWT_EXPIRATION_HOURS="${{ vars.JWT_EXPIRATION_HOURS }}" \
            --from-literal=PORT="${{ vars.PORT }}" \
            --namespace=production \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          export KUBECONFIG=kubeconfig
          kubectl apply -f k8s/configmap.yaml -n production
          kubectl apply -f k8s/deployment.yaml -n production
          kubectl apply -f k8s/service.yaml -n production
          kubectl apply -f k8s/ingress.yaml -n production
          kubectl apply -f k8s/hpa.yaml -n production

      - name: Update image to latest
        run: |
          export KUBECONFIG=kubeconfig
          kubectl set image deployment/devops-microservice \
            devops-microservice=${{ steps.image-vars.outputs.registry }}/${{ steps.image-vars.outputs.image-name }}:latest \
            -n production

      - name: Wait for rollout
        run: |
          export KUBECONFIG=kubeconfig
          kubectl rollout status deployment/devops-microservice -n production --timeout=5m

      - name: Verify deployment
        run: |
          export KUBECONFIG=kubeconfig
          echo "=== Pods Status ==="
          kubectl get pods -n production -l app=devops-microservice
          echo ""
          echo "=== Service Status ==="
          kubectl get svc -n production devops-microservice
          echo ""
          echo "=== Deployment Status ==="
          kubectl get deployment devops-microservice -n production

      - name: Run smoke tests
        run: |
          export KUBECONFIG=kubeconfig
          SERVICE_IP=$(kubectl get svc devops-microservice -n production -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Service IP: $SERVICE_IP"
          if [ -n "$SERVICE_IP" ]; then
            echo "Waiting for service to be ready..."
            sleep 30
            curl -f http://$SERVICE_IP/health || echo "Health check failed"
          fi

      - name: Verify TLS Certificate
        run: |
          export KUBECONFIG=kubeconfig
          echo "=== Certificate Status ==="
          kubectl get certificate -n production
          echo ""
          echo "=== Certificate Details ==="
          kubectl describe certificate devops-tls-secret -n production || echo "Certificate not created yet"
          echo ""
          echo "=== TLS Secret Status ==="
          kubectl get secret devops-tls-secret -n production || echo "TLS secret not created yet"

  # Stage 6: Manual Deployment
  deploy-manual:
    name: Manual Deploy (Any Version)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image variables
        id: image-vars
        run: |
          REGISTRY="${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io"
          IMAGE_NAME="${{ github.event.repository.name }}"
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT
          echo "image-name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "Full image: ${REGISTRY}/${IMAGE_NAME}:${{ github.event.inputs.version }}"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configure kubectl (Production)
        if: github.event.inputs.environment == 'production'
        run: |
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl config use-context $(kubectl config current-context)

      - name: Configure kubectl (Development)
        if: github.event.inputs.environment == 'development'
        run: |
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl config use-context $(kubectl config current-context)

      - name: Install cert-manager (if not exists)
        run: |
          export KUBECONFIG=kubeconfig
          if ! kubectl get namespace cert-manager >/dev/null 2>&1; then
            echo " Installing cert-manager..."
            kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.0/cert-manager.yaml
            echo " Waiting for cert-manager to be ready..."
            kubectl wait --for=condition=Available --timeout=300s deployment/cert-manager -n cert-manager
            kubectl wait --for=condition=Available --timeout=300s deployment/cert-manager-webhook -n cert-manager
            kubectl wait --for=condition=Available --timeout=300s deployment/cert-manager-cainjector -n cert-manager
            echo " cert-manager installed successfully"
          else
            echo " cert-manager is already installed"
          fi

      - name: Apply ClusterIssuer
        run: |
          export KUBECONFIG=kubeconfig
          export LETSENCRYPT_EMAIL="${{ secrets.LETSENCRYPT_EMAIL }}"

          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo " Applying production ClusterIssuer"
            envsubst < k8s/cluster-issuer.template.yaml | kubectl apply -f -
            sleep 10
            kubectl get clusterissuer letsencrypt-prod -o yaml
          else
            echo " Applying development ClusterIssuer"
            envsubst < k8s/cluster-issuer-development.template.yaml | kubectl apply -f -
            sleep 10
            kubectl get clusterissuer letsencrypt-development -o yaml
          fi

      - name: Verify image exists in ACR
        run: |
          echo "Checking if image exists in ACR..."
          docker pull ${{ steps.image-vars.outputs.registry }}/${{ steps.image-vars.outputs.image-name }}:${{ github.event.inputs.version }}
          if [ $? -eq 0 ]; then
            echo " Image tag ${{ github.event.inputs.version }} exists and can be pulled"
          else
            echo " Image tag ${{ github.event.inputs.version }} not found or cannot be pulled"
            exit 1
          fi

      - name: Deploy specified version
        run: |
          export KUBECONFIG=kubeconfig
          echo " Deploying version: ${{ github.event.inputs.version }}"
          echo " Environment: ${{ github.event.inputs.environment }}"

          # Update deployment image
          kubectl set image deployment/devops-microservice \
            devops-microservice=${{ steps.image-vars.outputs.registry }}/${{ steps.image-vars.outputs.image-name }}:${{ github.event.inputs.version }} \
            -n ${{ github.event.inputs.environment }}

          # Wait for rollout
          kubectl rollout status deployment/devops-microservice \
            -n ${{ github.event.inputs.environment }} \
            --timeout=5m

      - name: Verify deployment
        run: |
          export KUBECONFIG=kubeconfig
          echo "=== Deployment Info ==="
          kubectl describe deployment devops-microservice -n ${{ github.event.inputs.environment }}
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n ${{ github.event.inputs.environment }} -l app=devops-microservice
          echo ""
          echo "=== Current Image ==="
          kubectl get deployment devops-microservice -n ${{ github.event.inputs.environment }} \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo ""

      - name: Verify TLS Certificate
        run: |
          export KUBECONFIG=kubeconfig
          echo " === Certificate Status ==="
          kubectl get certificate -n ${{ github.event.inputs.environment }} || echo "No certificates found yet"
          echo ""

          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            SECRET_NAME="devops-tls-secret"
          else
            SECRET_NAME="devops-tls-secret-dev"
          fi

          echo " === Certificate Details ==="
          kubectl describe certificate $SECRET_NAME -n ${{ github.event.inputs.environment }} || echo "Certificate not created yet - will be created automatically"
          echo ""
          echo " === TLS Secret Status ==="
          kubectl get secret $SECRET_NAME -n ${{ github.event.inputs.environment }} || echo "TLS secret not created yet - certificate is being provisioned"

      - name: Deployment summary
        run: |
          echo " Successfully deployed version ${{ github.event.inputs.version }} to ${{ github.event.inputs.environment }}"
          echo ""
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo " URL: https://devops-api.172.190.229.231.nip.io"
            echo " Certificate: Let's Encrypt Production"
          else
            echo " URL: https://devops-api-dev.172.190.229.231.nip.io"
            echo " Certificate: Let's Encrypt Staging (will show browser warning)"
          fi
          echo ""
          echo " Note: SSL certificate may take 1-2 minutes to be issued after first deployment"
